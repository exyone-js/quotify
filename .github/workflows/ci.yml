name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复推送只保留最新一次运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 测试跑在 Workers 运行时（@cloudflare/vitest-pool-workers），无需额外服务。
      - name: 类型检查
        run: npm run typecheck

      - name: 单元 / 集成测试
        run: npm test
