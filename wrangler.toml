name = "epigram-api"
main = "src/index.ts"
# 注意：本地测试链路（@cloudflare/vitest-pool-workers 内置的 miniflare/workerd）
# 目前支持到 2026-08-22，因此这里取 2026-08-01 以保证 dev / test / deploy 三端一致。
compatibility_date = "2026-08-01"

[vars]
ENVIRONMENT = "production"
# 数据源：JSON 字符串数组，可配置**多个不同来源**，随机抽取时合并成一个总池。
# 任意「公网可访问、且返回符合本项目数据格式的 JSON」的链接都可以，例如：
#   DATA_SOURCES = '["https://example.com/a.json", "https://example.com/b.json"]'
# 默认指向作者维护的 epigram-data 仓库；Fork 后请替换成你自己的仓库地址，
# 否则你改不动数据（数据格式与校验规则见 README「数据仓库格式」）。
DATA_SOURCES = '["https://raw.githubusercontent.com/exyone-js/epigram-data/main/data.json"]'
DATA_TTL = "300"
# 访问根域（`/`）时 302 跳转的目标（站内绝对路径），默认指向公开随机一言接口
ROOT_REDIRECT = "/api/quotes/"
# 本地开发默认值；生产环境请用 `wrangler secret put ADMIN_TOKEN` 覆盖
ADMIN_TOKEN = "dev-secret-token"

[[kv_namespaces]]
binding = "CACHE"
# KV 命名空间：下面的 id 属于本项目作者，Fork 后你无权访问，必须换成自己的。
# 创建命令：npx wrangler kv namespace create epigram-cache
# 然后用输出结果里的 id 覆盖下一行（完整部署步骤见 README「部署」章节）。
id = "b38989b10a4d4a119bd6bb8adc93e21b"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
